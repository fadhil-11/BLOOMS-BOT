{% extends "base.html" %}

{% block title %}Review Paper — Blooms Bot{% endblock %}
{% block topbar_title %}Review & Export{% endblock %}
{% block topbar_actions %}
  <button class="btn btn-ghost btn-sm" onclick="location.href='/papers'">← Papers</button>
  <button class="btn btn-ghost btn-sm" onclick="printPaper()">🖨 Print</button>
  <button class="btn btn-primary btn-sm" onclick="saveRevisions()">Save Revisions</button>
{% endblock %}

{% block content %}
<div id="review-wrap">
  <div style="display:flex;align-items:center;justify-content:center;height:200px">
    <div class="loader"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const PAPER_ID = {{ paper_id }};
let paper = null;
let questions = [];
let courses = [];

async function init() {
  const [pr, cr] = await Promise.all([
    fetch(`/api/papers/${PAPER_ID}`),
    fetch('/api/courses'),
  ]);
  paper = (await pr.json()).paper;
  courses = (await cr.json()).courses || [];
  questions = paper.questions || [];
  render();
}

function getCourse() {
  return courses.find(c => c.id === paper.course_id);
}

function normalizePaperTitle(rawTitle, fallbackTitle) {
  const fallback = String(fallbackTitle || 'Question Paper').trim() || 'Question Paper';
  const title = String(rawTitle || '').trim();
  if (!title) return fallback;

  const revisedGenerated = /^revised\s*[-:]\s*generated\s+paper\s*[-:]\s*(.+)$/i.exec(title);
  if (revisedGenerated && revisedGenerated[1]) {
    return `Revised - ${revisedGenerated[1].trim()}`;
  }

  const withoutPrefix = title.replace(/^generated\s+paper\s*[-:]\s*/i, '').trim();
  if (!withoutPrefix || /^generated\s+paper$/i.test(withoutPrefix)) return fallback;
  return withoutPrefix;
}

function getDisplayPaperTitle(course) {
  return normalizePaperTitle(paper?.title, course?.name || 'Question Paper');
}

function render() {
  const course = getCourse();
  const displayTitle = getDisplayPaperTitle(course);
  const totalMarks = questions.reduce((s,q) => s + (q.marks||0), 0);

  // Bloom distribution
  const bloomCounts = {};
  questions.forEach(q => {
    if (q.bloom_level) bloomCounts[q.bloom_level] = (bloomCounts[q.bloom_level]||0) + 1;
  });

  document.getElementById('review-wrap').innerHTML = `
    <!-- HEADER CARD -->
    <div class="card" style="margin-bottom:24px;border-left:3px solid var(--amber)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px">
        <div>
          <div style="font-size:11px;color:var(--text-3);font-family:var(--font-mono);letter-spacing:1px;margin-bottom:6px">QUESTION PAPER</div>
          <h1 style="margin-bottom:8px">${displayTitle}</h1>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            ${course ? `<span class="chip">📘 ${course.name}</span>` : ''}
            <span class="chip">⏱ ${paper.duration_minutes} min</span>
            <span class="chip">📅 ${new Date(paper.created_at).toLocaleDateString()}</span>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:200px">
          <div style="text-align:center;padding:14px;background:var(--bg-2);border-radius:var(--radius);border:1px solid var(--border)">
            <div style="font-size:10px;color:var(--text-3);font-family:var(--font-mono)">TOTAL MARKS</div>
            <div style="font-family:var(--font-serif);font-size:28px;color:var(--amber)">${totalMarks}</div>
          </div>
          <div style="text-align:center;padding:14px;background:var(--bg-2);border-radius:var(--radius);border:1px solid var(--border)">
            <div style="font-size:10px;color:var(--text-3);font-family:var(--font-mono)">QUESTIONS</div>
            <div style="font-family:var(--font-serif);font-size:28px;color:var(--text)">${questions.length}</div>
          </div>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 280px;gap:24px;align-items:start">

      <!-- QUESTIONS LIST -->
      <div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <h3>Questions</h3>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost btn-sm" onclick="addQuestion()">+ Add</button>
          </div>
        </div>
        <div id="q-list" style="display:flex;flex-direction:column;gap:10px">
          ${questions.map((q, i) => renderQuestion(q, i)).join('')}
        </div>
      </div>

      <!-- SIDEBAR -->
      <div style="position:sticky;top:80px;display:flex;flex-direction:column;gap:16px">

        <!-- BLOOM DISTRIBUTION -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">Bloom Distribution</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px" id="bloom-dist-sidebar">
            ${['Remember','Understand','Apply','Analyze','Evaluate','Create'].map(level => {
              const count = bloomCounts[level] || 0;
              const pct = questions.length ? Math.round(count / questions.length * 100) : 0;
              const colors = {Remember:'#60a0e0',Understand:'#4caf7d',Apply:'#f5a623',Analyze:'#9b7ef8',Evaluate:'#f05454',Create:'#38d9c0'};
              return `<div class="bloom-bar">
                <div class="bloom-bar-header">
                  <span class="bloom-bar-label" style="color:${colors[level]}">${level}</span>
                  <span class="bloom-bar-pct">${count}q · ${pct}%</span>
                </div>
                <div class="bloom-bar-track">
                  <div class="bloom-bar-fill" style="width:${pct}%;background:${colors[level]}"></div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>

        <!-- MARKS BREAKDOWN -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">Mark Breakdown</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            ${(() => {
              const byMarks = {};
              questions.forEach(q => { byMarks[q.marks] = (byMarks[q.marks]||0) + 1; });
              return Object.entries(byMarks).sort((a,b) => a[0]-b[0]).map(([m, cnt]) =>
                `<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px">
                  <span style="color:var(--text-2)">${m}-mark questions</span>
                  <span style="font-family:var(--font-mono);color:var(--text)">×${cnt}</span>
                </div>`
              ).join('');
            })()}
          </div>
        </div>

        <!-- EXPORT -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">Export</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <button class="btn btn-ghost" style="justify-content:flex-start;gap:10px" onclick="printPaper()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              Print / Save PDF
            </button>
            <button class="btn btn-ghost" style="justify-content:flex-start;gap:10px" onclick="downloadDocx()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
              Download DOCX
            </button>
            <button class="btn btn-ghost" style="justify-content:flex-start;gap:10px" onclick="copyText()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              Copy as Text
            </button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderQuestion(q, i) {
  const colors = {Remember:'#60a0e0',Understand:'#4caf7d',Apply:'#f5a623',Analyze:'#9b7ef8',Evaluate:'#f05454',Create:'#38d9c0'};
  const color = colors[q.bloom_level] || 'var(--text-3)';
  return `
    <div class="card" id="q-card-${i}" style="padding:18px;border-left:3px solid ${color};transition:border-color 0.2s" data-idx="${i}">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="width:28px;height:28px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--text-3);flex-shrink:0">${i+1}</div>
        <div style="flex:1">
          <div class="q-text" style="color:var(--text);line-height:1.6;font-size:14px">${q.text}</div>
          <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
            ${bloomBadge(q.bloom_level)}
            ${diffBadge(q.difficulty)}
            <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-3)">${q.marks} marks</span>
          </div>
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="btn-icon" onclick="editQ(${i})" title="Edit" style="padding:6px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon" onclick="removeQ(${i})" title="Remove" style="padding:6px;color:var(--red);border-color:var(--red-dim)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>
  `;
}

function editQ(i) {
  const q = questions[i];
  const newText = prompt('Edit question:', q.text);
  if (newText && newText.trim()) {
    questions[i].text = newText.trim();
    document.getElementById(`q-card-${i}`).querySelector('.q-text').textContent = newText.trim();
    showToast('Question updated — save to keep changes', 'info');
  }
}

function removeQ(i) {
  if (!confirm('Remove this question from the paper?')) return;
  questions.splice(i, 1);
  render();
  showToast('Question removed', 'info');
}

function addQuestion() {
  const text = prompt('Enter new question:');
  if (!text) return;
  questions.push({ text: text.trim(), marks: 5, bloom_level: null, difficulty: 'medium' });
  render();
  showToast('Question added — save to keep changes', 'info');
}

async function saveRevisions() {
  try {
    const r = await fetch(`/api/papers/${PAPER_ID}/revise`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ questions, total_marks: questions.reduce((s,q) => s+(q.marks||0), 0) })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    showToast('Revised paper saved!', 'success');
    setTimeout(() => location.href = `/review/${d.paper.id}`, 800);
  } catch(e) { showToast(e.message, 'error'); }
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatQuestionText(text) {
  return escapeHtml(text).replace(/\r?\n/g, '<br>');
}

function sectionTitleByMarks(marks) {
  if (marks <= 2) return 'Short Answer Questions';
  if (marks <= 5) return 'Medium Answer Questions';
  return 'Long Answer Questions';
}

function printPaper() {
  const course = getCourse();
  const displayTitle = getDisplayPaperTitle(course);
  const showCourseLine = !!(course && course.name && displayTitle.toLowerCase() !== String(course.name).trim().toLowerCase());
  const totalMarks = questions.reduce((s, q) => s + (q.marks || 0), 0);
  const printDate = new Date(paper.created_at).toLocaleDateString('en-GB', {
    day: '2-digit',
    month: 'short',
    year: 'numeric',
  });

  const groupedByMarks = {};
  questions.forEach((q) => {
    const marks = Number(q.marks) || 0;
    if (!groupedByMarks[marks]) groupedByMarks[marks] = [];
    groupedByMarks[marks].push(q);
  });
  const markBands = Object.keys(groupedByMarks).map(Number).sort((a, b) => a - b);

  let questionNumber = 0;
  const sectionHtml = markBands.map((marks, idx) => {
    const sectionCode = String.fromCharCode(65 + idx);
    const rows = groupedByMarks[marks] || [];
    const title = sectionTitleByMarks(marks);
    return `
      <section class="paper-section">
        <div class="section-head">
          <div class="section-label">SECTION ${sectionCode}</div>
          <div class="section-mark">${marks} Marks Each</div>
        </div>
        <div class="section-title">${title}</div>
        <div class="section-note">Answer all questions in this section.</div>
        <table class="question-table">
          <tbody>
            ${rows.map((q) => {
              questionNumber += 1;
              return `
                <tr class="question-row">
                  <td class="qno">${questionNumber}.</td>
                  <td class="qtext">${formatQuestionText(q.text)}</td>
                  <td class="qmarks">(${q.marks})</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </section>
    `;
  }).join('');

  const w = window.open('', '_blank');
  if (!w) {
    showToast('Allow pop-ups to print or save PDF.', 'error');
    return;
  }

  w.document.write(`<!DOCTYPE html>
  <html>
    <head>
      <meta charset="utf-8">
      <title>${escapeHtml(displayTitle)}</title>
      <style>
        @page { size: A4 portrait; margin: 18mm 16mm; }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          color: #111;
          font-family: "Times New Roman", Times, serif;
          font-size: 12pt;
          line-height: 1.45;
        }
        .paper-shell { max-width: 180mm; margin: 0 auto; }
        .paper-header {
          border: 1.5px solid #111;
          padding: 10px 12px;
          margin-bottom: 12px;
        }
        .org-name {
          text-align: center;
          font-weight: 700;
          font-size: 14pt;
          letter-spacing: 0.8px;
          margin-bottom: 4px;
        }
        .paper-title {
          text-align: center;
          font-weight: 700;
          font-size: 13pt;
          margin-bottom: 2px;
          text-transform: uppercase;
        }
        .course-name {
          text-align: center;
          font-size: 11.5pt;
          margin-bottom: 8px;
        }
        .meta-table {
          width: 100%;
          border-collapse: collapse;
          border: 1px solid #111;
        }
        .meta-table th, .meta-table td {
          border: 1px solid #111;
          padding: 5px 6px;
          font-size: 10.5pt;
          text-align: left;
          vertical-align: top;
        }
        .meta-table th {
          width: 18%;
          font-weight: 700;
          background: #f4f4f4;
        }
        .candidate-row {
          display: flex;
          justify-content: space-between;
          gap: 12px;
          margin: 10px 0 6px;
          font-size: 10.5pt;
        }
        .instructions {
          border: 1px solid #111;
          padding: 8px 10px;
          margin-bottom: 12px;
        }
        .instructions-title {
          font-weight: 700;
          margin-bottom: 4px;
          text-transform: uppercase;
          font-size: 10.5pt;
        }
        .instructions ol {
          margin: 0;
          padding-left: 20px;
          font-size: 10.5pt;
        }
        .instructions li { margin-bottom: 2px; }
        .paper-section { margin: 14px 0 0; page-break-inside: avoid; }
        .section-head {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          border-bottom: 1px solid #111;
          padding-bottom: 3px;
          margin-bottom: 5px;
        }
        .section-label {
          font-weight: 700;
          letter-spacing: 0.5px;
        }
        .section-mark {
          font-weight: 700;
          font-size: 10.5pt;
        }
        .section-title {
          font-style: italic;
          margin-bottom: 2px;
          font-size: 10.5pt;
        }
        .section-note {
          margin-bottom: 7px;
          font-size: 10.5pt;
        }
        .question-table {
          width: 100%;
          border-collapse: collapse;
          table-layout: fixed;
        }
        .question-row {
          border-bottom: 1px solid #ddd;
          page-break-inside: avoid;
        }
        .question-table td {
          padding: 7px 3px;
          vertical-align: top;
        }
        .qno {
          width: 34px;
          font-weight: 700;
        }
        .qtext {
          width: auto;
          text-align: justify;
          padding-right: 8px;
        }
        .qmarks {
          width: 52px;
          text-align: right;
          font-weight: 700;
          white-space: nowrap;
        }
        .empty-state {
          border: 1px dashed #666;
          padding: 12px;
          text-align: center;
          margin-top: 10px;
        }
        @media print {
          body {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
          }
          .paper-shell { margin: 0; }
        }
      </style>
    </head>
    <body>
      <div class="paper-shell">
        <header class="paper-header">
          <div class="org-name">UNIVERSITY EXAMINATION</div>
          <div class="paper-title">${escapeHtml(displayTitle)}</div>
          ${showCourseLine ? `<div class="course-name">${escapeHtml(course.name)}</div>` : ''}
          <table class="meta-table">
            <tr>
              <th>Department</th>
              <td>${escapeHtml(course?.department || 'N/A')}</td>
              <th>Date</th>
              <td>${escapeHtml(printDate)}</td>
            </tr>
            <tr>
              <th>Semester</th>
              <td>${escapeHtml(course?.semester || 'N/A')}</td>
              <th>Duration</th>
              <td>${escapeHtml(String(paper.duration_minutes || 0))} Minutes</td>
            </tr>
            <tr>
              <th>Total Questions</th>
              <td>${questions.length}</td>
              <th>Maximum Marks</th>
              <td>${totalMarks}</td>
            </tr>
          </table>
          <div class="candidate-row">
            <span>Register Number: ____________________</span>
            <span>Answer Book Number: ____________________</span>
          </div>
        </header>

        <section class="instructions">
          <div class="instructions-title">Instructions</div>
          <ol>
            <li>Answer all questions in the provided answer booklet.</li>
            <li>Marks for each question are indicated at the right margin.</li>
            <li>Write the question number clearly for every answer.</li>
          </ol>
        </section>

        ${sectionHtml || '<div class="empty-state">No questions are available for printing.</div>'}
      </div>
    </body>
  </html>`);
  w.document.close();
  setTimeout(() => w.print(), 450);
}

async function downloadDocx() {
  try {
    const response = await fetch(`/api/papers/${PAPER_ID}/export/docx`);
    if (!response.ok) {
      const payload = await response.json().catch(() => ({}));
      throw new Error(payload.error || 'DOCX export failed');
    }

    const blob = await response.blob();
    const url = window.URL.createObjectURL(blob);
    const course = getCourse();
    const displayTitle = getDisplayPaperTitle(course);
    const safeTitle = (displayTitle || 'question_paper')
      .replace(/[^a-z0-9._ -]/gi, '')
      .trim()
      .replace(/\s+/g, '_') || 'question_paper';

    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = `${safeTitle}.docx`;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    window.URL.revokeObjectURL(url);
    showToast('DOCX downloaded', 'success');
  } catch (e) {
    showToast(e.message || 'DOCX export failed', 'error');
  }
}

function copyText() {
  const displayTitle = getDisplayPaperTitle(getCourse());
  const totalMarks = questions.reduce((s,q) => s+(q.marks||0), 0);
  let text = `${displayTitle}\nTotal Marks: ${totalMarks} | Duration: ${paper.duration_minutes} min\n\n`;
  questions.forEach((q,i) => {
    text += `Q${i+1}. ${q.text} [${q.marks} marks]\n`;
  });
  navigator.clipboard.writeText(text)
    .then(() => showToast('Copied to clipboard!', 'success'))
    .catch(() => showToast('Copy failed', 'error'));
}

init();
</script>
{% endblock %}
