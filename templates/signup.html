<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Blooms Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0d0f14; --bg-1:#13161e; --bg-2:#191d28;
      --border:#252b3b; --border-2:#2e3650;
      --text:#e8eaf0; --text-2:#a0a8c0;
      --amber:#f5a623; --amber-glow:#f5a62322;
      --font-serif:'Libre Baskerville',Georgia,serif;
      --font-sans:'Outfit',sans-serif;
      --font-mono:'DM Mono',monospace;
      --radius:6px;
    }

    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

    body {
      min-height:100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card {
      width:min(480px, 100%);
      background: var(--bg-1);
      border:1px solid var(--border);
      border-radius:10px;
      padding:28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .brand {
      font-family: var(--font-serif);
      font-size: 24px;
      font-style: italic;
      margin-bottom: 16px;
    }

    .brand span { color: var(--amber); }

    .title {
      font-size: 24px;
      margin-bottom: 6px;
      font-family: var(--font-serif);
      font-style: italic;
    }

    .subtitle {
      color: var(--text-2);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 14px; }

    .form-label {
      display:block;
      font-size:10px;
      font-family: var(--font-mono);
      letter-spacing:1.4px;
      text-transform:uppercase;
      color: var(--text-2);
      margin-bottom:8px;
    }

    .form-input {
      width:100%;
      background: var(--bg-2);
      border:1px solid var(--border-2);
      border-radius: var(--radius);
      color: var(--text);
      padding:12px 14px;
      font-size:14px;
      outline:none;
    }

    .form-input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px var(--amber-glow);
    }

    .btn {
      width:100%;
      border:none;
      border-radius: var(--radius);
      padding:12px;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      transition: all 0.15s;
      margin-top:10px;
    }

    .btn-primary {
      background: var(--amber);
      color:#0d0f14;
    }

    .btn-secondary {
      background: transparent;
      color: var(--amber);
      border:1px solid var(--amber);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--amber-glow);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span>Blooms</span> Bot</div>
    <h1 class="title">Create account</h1>
    <p class="subtitle">Sign up to start generating Bloom-aligned papers.</p>

    <div class="form-group">
      <label class="form-label">Full name</label>
      <input class="form-input" type="text" placeholder="Faculty Member" />
    </div>

    <div class="form-group">
      <label class="form-label">Email address</label>
      <input class="form-input" type="email" placeholder="faculty@university.edu" />
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" placeholder="Enter password" />
    </div>

    <button class="btn btn-primary" onclick="location.href='/upload'">Sign Up -></button>
    <button class="btn btn-secondary" onclick="location.href='/login'">Already have an account? Sign In</button>
    <button class="btn btn-secondary" onclick="location.href='/'">Back to Landing</button>
  </div>
</body>
</html>
